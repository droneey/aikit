<svg xmlns="http://www.w3.org/2000/svg" width="106" height="24" viewBox="0 0 106 24" role="img" aria-label="License: MIT">
  <title>License: MIT</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#C026D3"/>
      <stop offset="1" stop-color="#E11D48"/>
    </linearGradient>
    <clipPath id="shape">
      <rect width="106" height="24" rx="6"/>
