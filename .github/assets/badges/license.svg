<svg xmlns="http://www.w3.org/2000/svg" width="97" height="24" viewBox="0 0 97 24" role="img" aria-label="License: MIT">
  <title>License: MIT</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7D53DC"/>
      <stop offset="1" stop-color="#A83FB8"/>
    </linearGradient>
    <clipPath id="shape">
      <rect width="97" height="24" rx="8"/>
    </clipPath>
  </defs>
  <g clip-path="url(#shape)">
    <rect width="58" height="24" fill="#3F3F46"/>
    <rect x="58" width="39" height="24" fill="url(#accent)"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    <text x="29" y="16" fill="#F4F4F5">license</text>
    <text x="77.5" y="16" fill="#FFFFFF">MIT</text>
  </g>
